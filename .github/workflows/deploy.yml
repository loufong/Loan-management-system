name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite & React
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite Application
        working-directory: frontend
        env:
          # Supabase Repository Secrets passed into Vite build environment
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Production API URL if backend is deployed separately
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          NODE_ENV: production
        run: npm run build

      - name: Setup SPA Routing & .nojekyll
        run: |
          # Prevent GitHub Pages from using Jekyll processing (preserves _assets and vendor folders)
          touch frontend/dist/.nojekyll
          # Ensure 404.html exists for Single Page Application (SPA) deep linking
          if [ -f 404.html ]; then
            cp 404.html frontend/dist/404.html
          elif [ -f frontend/dist/index.html ]; then
            cp frontend/dist/index.html frontend/dist/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
