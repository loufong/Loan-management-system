<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jam Song Vich | Loan Management System</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: redirect all 404s to index.html with query parameter
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoName = '/Loan-management-system';
      var path = l.pathname;
      if (path.startsWith(repoName)) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          repoName + '/?/' +
          path.slice(repoName.length + 1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      } else {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/?/' +
          path.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Jam Song Vich...</p>
  </body>
</html>
