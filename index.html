    <!-- Dynamic Base Resolution for Localhost & GitHub Pages -->
    <script type="text/javascript">
      (function() {
        var host = window.location.hostname;
        var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0' || host.startsWith('192.168.');
        var baseTag = document.createElement('base');
        if (isLocal) {
          baseTag.href = '/';
        } else if (window.location.pathname.toLowerCase().startsWith('/loan-management-system')) {
          baseTag.href = window.location.pathname.slice(0, '/loan-management-system'.length) + '/';
        } else {
          baseTag.href = './';
        }
        document.head.prepend(baseTag);
      })();
    </script>

    <!-- GitHub Pages SPA routing decoder -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- Instant Inline Styles for Ultra-Smooth Loading Screen (0ms FCP, Zero Layout Shift) -->
    <style id="apex-loader-styles">
      #apex-splash-loader {
        position: fixed;
        inset: 0;
        z-index: 9999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 25%, #0F172A 0%, #090E1A 60%, #030712 100%);
        color: #F8FAFC;
        font-family: 'Suwannaphum', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s;
        overflow: hidden;
        -webkit-user-select: none;
           -moz-user-select: none;
                user-select: none;
      }
      #apex-splash-loader.apex-loader-hidden {
        opacity: 0;
        transform: scale(1.02);
        visibility: hidden;
        pointer-events: none;
      }
      .apex-loader-glow {
        position: absolute;
        width: 440px;
        height: 440px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.28) 0%, rgba(37, 99, 235, 0) 70%);
        filter: blur(50px);
        pointer-events: none;
        animation: apexPulse 3.5s ease-in-out infinite alternate;
      }
      @keyframes apexPulse {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 0.9; }
      }
      .apex-loader-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 36px 32px;
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        max-width: 420px;
        width: calc(100% - 32px);
        box-sizing: border-box;
      }
      .apex-loader-icon-wrap {
        position: relative;
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .apex-loader-spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(56, 189, 248, 0.15);
        border-top-color: #38BDF8;
        border-right-color: #2563EB;
        animation: apexSpin 1.1s linear infinite;
      }
      .apex-loader-icon-box {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.28) 0%, rgba(30, 64, 175, 0.45) 100%);
        border: 1px solid rgba(56, 189, 248, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #38BDF8;
        box-shadow: 0 0 20px rgba(37, 99, 235, 0.45);
      }
      @keyframes apexSpin {
        100% { transform: rotate(360deg); }
      }
      .apex-loader-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 4px 0;
        color: #FFFFFF;
      }
      .apex-loader-subtitle {
        font-size: 13px;
        font-weight: 500;
        color: #94A3B8;
        margin: 0 0 22px 0;
        line-height: 1.5;
      }
      .apex-loader-progress-area {
        width: 100%;
        margin-bottom: 20px;
      }
      .apex-loader-bar-wrap {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 10px;
      }
      .apex-loader-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(90deg, #2563EB 0%, #38BDF8 50%, #60A5FA 100%);
        border-radius: 9999px;
        animation: apexBarSweep 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
      }
      @keyframes apexBarSweep {
        0% { left: -40%; width: 30%; }
        50% { left: 35%; width: 45%; }
        100% { left: 100%; width: 30%; }
      }
      .apex-loader-status {
        font-size: 12px;
        color: #94A3B8;
        min-height: 18px;
        line-height: 1.4;
      }
      .apex-loader-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        background: rgba(16, 185, 129, 0.08);
        border: 1px solid rgba(16, 185, 129, 0.2);
        border-radius: 9999px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #34D399;
      }
      .apex-loader-fallback {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
      }
      .apex-fallback-text {

      .apex-fallback-actions {

  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans antialiased selection:bg-[#2563EB] selection:text-white">
    <!-- Smooth Animated Preloader Screen -->
    <div id="apex-splash-loader" aria-live="polite">
      <div class="apex-loader-glow"></div>

        </div>
        
        <div class="apex-loader-brand">

        </div>

        <div class="apex-loader-progress-area">
          <div class="apex-loader-bar-wrap">

          <div class="apex-loader-status" id="apex-loader-status-text">
            កំពុងតភ្ជាប់ប្រព័ន្ធសុវត្ថិភាព... (Connecting Secure Core)
          </div>
        </div>

        <div class="apex-loader-badge">

            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>256-BIT SSL ENCRYPTION • FINANCIAL LEDGER</span>
        </div>

        <!-- Automatic Diagnostics & Recovery Panel (Shows if network hangs > 7s or error occurs) -->
        <div class="apex-loader-fallback" id="apex-loader-fallback" style="display: none;">
          <p class="apex-fallback-text" id="apex-fallback-text">
            ការផ្ទុកចំណាយពេលយូរជាងធម្មតា។ សូមចុចប៊ូតុងខាងក្រោមដើម្បីដំណើរការឡើងវិញ៖
          </p>
          <div class="apex-fallback-actions">
            <button type="button" class="apex-fallback-btn apex-fallback-btn-primary" onclick="window.location.reload()">
              ↻ ផ្ទុកឡើងវិញ (Reload)
            </button>
            <button type="button" class="apex-fallback-btn" onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload(true)">
              សម្អាត Cache & Reload
            </button>
          </div>
          <div class="apex-fallback-details" id="apex-fallback-details" style="display: none;"></div>
        </div>

    </div>

    <!-- Preloader Progress and Error-Handling Controller -->
    <script type="text/javascript">
      (function() {
        var statusEl = document.getElementById('apex-loader-status-text');
        var fallbackEl = document.getElementById('apex-loader-fallback');
        var detailsEl = document.getElementById('apex-fallback-details');
        
        var t1 = setTimeout(function() {
          if (statusEl) statusEl.textContent = 'កំពុងផ្ទុកទិន្នន័យ & ម៉ូឌុលធនាគារ... (Loading Banking Engine)';
        }, 1200);
        
        var t2 = setTimeout(function() {
          if (statusEl) statusEl.textContent = 'កំពុងរៀបចំផ្ទាំងគ្រប់គ្រងឥណទាន... (Initializing Interface)';
        }, 2600);
        
        var t3 = setTimeout(function() {
          if (typeof window.apexHideLoader === 'function') {
            window.apexHideLoader();
          }
        }, 3000);

        window.addEventListener('unhandledrejection', function(event) {
          console.warn('Unhandled promise rejection caught by preloader fallback:', event.reason);
          if (typeof window.apexHideLoader === 'function') {
            window.apexHideLoader();
          }
        });

        window.addEventListener('error', function(e) {
          if (fallbackEl) fallbackEl.style.display = 'block';
          if (detailsEl) {
            detailsEl.style.display = 'block';
            detailsEl.textContent = 'Error: ' + (e.message || 'Script resource error');
          }
        });

        window.apexHideLoader = function() {
          clearTimeout(t1);
          clearTimeout(t2);
          clearTimeout(t3);
          var loader = document.getElementById('apex-splash-loader');
          if (loader && !loader.classList.contains('apex-loader-hidden')) {
            loader.classList.add('apex-loader-hidden');
            setTimeout(function() {
              if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 500);
          }
        };
      })();
    </script>

    <div id="root"></div>
