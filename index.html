    <!-- Dynamic Base Resolution for Localhost & GitHub Pages -->
    <script type="text/javascript">
      (function() {
        var host = window.location.hostname;
        var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0' || host.startsWith('192.168.');
        var baseTag = document.createElement('base');
        if (isLocal) {
          baseTag.href = '/';
        } else if (window.location.pathname.startsWith('/Loan-management-system')) {
          baseTag.href = '/Loan-management-system/';
        } else {
          baseTag.href = '/';
        }
        document.head.prepend(baseTag);
      })();
    </script>

    <!-- GitHub Pages SPA routing decoder -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
