              }}
              currency={currency}
              onToggleCurrency={() => setCurrency(prev => prev === 'USD' ? 'KHR' : 'USD')}
            />

            {/* Page Router Body */}
            <main className="flex-1 overflow-y-auto p-4 md:p-8">
              {activeTab === 'dashboard' && (
                <Dashboard
                  currency={currency}
                  onNavigate={(tab) => {
                    if (tab === 'new-borrower') setActiveTab('borrowers');
                    else if (tab === 'new-application') setActiveTab('new-application');
                    else if (tab === 'quick-payment') setActiveTab('cashier');
                    else setActiveTab(tab);
                  }}
                  onSelectLoan={(id) => {
                    setSelectedLoanId(id);
                    setActiveTab('loans');
                  }}
                />
              )}

              {activeTab === 'borrowers' && (
                <BorrowerDirectory
                  onSelectBorrower={(id) => {
                    setSelectedBorrowerId(id);
                    setActiveTab('borrower-detail');
                  }}
                  onCreateApplication={(id) => {
                    setSelectedBorrowerId(id);
                    setActiveTab('new-application');
                  }}
                />
              )}

              {activeTab === 'borrower-detail' && (
                <BorrowerDetailDossier
                  borrowerId={selectedBorrowerId}
                  onBack={() => setActiveTab('borrowers')}
                  onCreateApplication={() => setActiveTab('new-application')}
                  onViewLoan={(id) => {
                    setSelectedLoanId(id);
                    setActiveTab('loans');
                  }}
                />
              )}

              {activeTab === 'new-application' && (
                <LoanApplicationWizard
                  onCancel={() => setActiveTab('dashboard')}
                  onSubmitSuccess={(appId) => {
                    setSelectedAppId(appId);
                    setActiveTab('applications');
                  }}
                />
              )}

              {activeTab === 'applications' && (
                <CreditReviewApproval
                  applicationId={selectedAppId}
                  currentRole={activeRole}
                  onApproved={(decision) => {
                    alert(`Loan application approved for $${decision.approvedAmount.toLocaleString()} at ${decision.approvedRate}% p.a.`);
                    setActiveTab('loans');
                  }}
                  onRejected={(reason) => {
                    alert(`Application rejected. Reason: ${reason}`);
                    setActiveTab('dashboard');
                  }}
                />
              )}

              {activeTab === 'loans' && (
                <LoanDetail
                  loanId={selectedLoanId}
                  onCollectPayment={() => setActiveTab('cashier')}
                  onBack={() => setActiveTab('dashboard')}
                />
              )}

              {activeTab === 'cashier' && (
                <CashierPaymentTerminal
                  initialLoanId={selectedLoanId}
                  cashierName="John Somnang"
                />
              )}

              {activeTab === 'reports' && (
                <BIReportingStudio />
              )}
            </main>
          </div>

          {/* Quick Search Modal (Ctrl + K) */}
          {searchModalOpen && (
            <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-2xl overflow-hidden">
                <div className="flex items-center px-4 py-3 border-b border-slate-200">
                  <Icon name="Search" className="w-5 h-5 text-slate-400 mr-3" />
                  <input
                    type="text"
                    autoFocus
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Quick search Borrowers, Loan #, National ID..."
                    className="w-full text-slate-800 placeholder-slate-400 bg-transparent text-sm focus:outline-none"
                  />
                  <button onClick={() => setSearchModalOpen(false)} className="p-1 text-slate-400 hover:text-slate-600">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="max-h-80 overflow-y-auto p-2">
                  <div className="px-3 py-1.5 text-xs font-semibold uppercase tracking-wider text-slate-400">Top Matches</div>
                  {filteredQuickSearch.map((res, i) => (
                    <button
                      key={i}
                      onClick={() => {
                        if (res.type === 'borrower') setSelectedBorrowerId(res.id);
                        if (res.type === 'loan') setSelectedLoanId(res.id);
                        if (res.type === 'application') setSelectedAppId(res.id);
                        setActiveTab(res.tab);
                        setSearchModalOpen(false);
                      }}
                      className="w-full text-left flex items-start gap-3 p-3 rounded-lg hover:bg-indigo-50/70 group transition-colors"
                    >
                      <div className="p-2 rounded-lg bg-slate-100 group-hover:bg-indigo-100 text-slate-600 group-hover:text-indigo-700">
                        <Icon name={res.type === 'borrower' ? 'User' : res.type === 'loan' ? 'CreditCard' : 'FileText'} className="w-4 h-4" />
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-slate-800 group-hover:text-indigo-900">{res.title}</span>
                          <span className="text-[11px] font-mono text-slate-400">{res.id}</span>
                        </div>
                        <p className="text-[11px] text-slate-500 truncate mt-0.5">{res.sub}</p>
                      </div>
                    </button>
                  ))}
                </div>

                <div className="bg-slate-50 px-4 py-2 border-t border-slate-200 flex justify-between text-[11px] text-slate-500">
                  <span>Press <kbd className="bg-white border px-1 rounded">ESC</kbd> to close</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
