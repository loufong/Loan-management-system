services:
  - type: web
    name: loan-management-system
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run frontend:build && npm run build && npx prisma generate
    startCommand: npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: loansystem-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: TOKEN_EXPIRES_IN
        value: "7d"

databases:
  - name: loansystem-db
    plan: free
    region: singapore
    databaseName: loansystem_db
    user: loansystem_user
